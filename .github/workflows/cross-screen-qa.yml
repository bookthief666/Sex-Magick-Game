name: M14 Visual-state QA

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
  schedule:
    - cron: '31 10 * * 1'
  push:
    branches:
      - develop/sex-magick-2.0
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'tools/visual-state-runtime.js'
      - 'tools/canvas-render-runtime.js'
      # Both affect what the page renders: the variety runtime moves pillar
      # geometry, and the missions runtime adds a HUD layer that must stay out of
      # the signature screenshots and inside the safe area at every geometry.
      - 'tools/obstacle-variety-runtime.js'
      - 'tools/missions-runtime.js'
      - 'tools/powerup-runtime.js'
      - 'tools/occult-art-runtime.js'
      - 'tools/occult-field-runtime.js'
      - '.github/workflows/cross-screen-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Verify QA supply chain
        run: npm run test:supply-chain

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-screen and visual-state matrix
        run: npm run test:cross-screen

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m15-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, videos, screenshots, signatures, and JSON
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m15-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
