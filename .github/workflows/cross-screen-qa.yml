name: M14 Visual-state QA

on:
  pull_request:
    branches:
      - develop/m13-cross-screen-automation
  push:
    branches:
      - develop/m14-visual-state-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned test dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-screen and visual-state matrix
        run: npm run test:cross-screen

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m14-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, videos, screenshots, signatures, and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m14-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
