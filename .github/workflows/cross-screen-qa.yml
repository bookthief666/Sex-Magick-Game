name: M14 Visual-state QA

on:
  pull_request:
    branches:
      - develop/m14-visual-state-regression
  push:
    branches:
      - develop/m15-qa-supply-chain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-screen and visual-state matrix
        run: npm run test:cross-screen

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m15-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, videos, screenshots, signatures, and JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m15-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
