name: M15 QA Supply-chain Audit

on:
  pull_request:
    branches:
      - develop/m14-visual-state-regression
  push:
    branches:
      - develop/m15-qa-supply-chain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply approved immutable workflow pins
        run: node tools/pin-workflow-actions.mjs

      - name: Commit generated supply-chain state on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json .github/workflows && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Committed lockfile and workflow pins already match policy.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows
          git commit -m 'M15: commit reproducible QA supply-chain state'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify committed supply-chain state is reproducible
        run: |
          npm ci --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          node tools/pin-workflow-actions.mjs
          git diff --exit-code -- package-lock.json .github/workflows
          npm run test:supply-chain

      - name: Capture production and full audit reports
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          npm audit --json > npm-audit-full.json || true
          node - <<'NODE'
          const fs = require('fs');
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const summarize = report => ({
            vulnerabilities: report.metadata?.vulnerabilities || {},
            dependencies: report.metadata?.dependencies || {},
            advisories: Object.entries(report.vulnerabilities || {}).map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: value.isDirect,
              via: (value.via || []).map(item => typeof item === 'string' ? item : {
                title: item.title,
                severity: item.severity,
                url: item.url,
                range: item.range
              }),
              effects: value.effects || [],
              range: value.range,
              fixAvailable: value.fixAvailable
            }))
          });
          fs.writeFileSync('npm-audit-summary.json', JSON.stringify({
            production: summarize(read('npm-audit-production.json')),
            full: summarize(read('npm-audit-full.json'))
          }, null, 2));
          NODE

      - name: Enforce production and high-severity policy
        run: |
          node - <<'NODE'
          const report = require('./npm-audit-summary.json');
          const production = report.production.vulnerabilities;
          const full = report.full.vulnerabilities;
          if (production.total !== 0) {
            throw new Error(`Production dependency vulnerabilities are not allowed: ${JSON.stringify(production)}`);
          }
          if ((full.high || 0) > 0 || (full.critical || 0) > 0) {
            throw new Error(`High or critical QA dependency vulnerabilities are not allowed: ${JSON.stringify(full)}`);
          }
          console.log(JSON.stringify({ production, full }, null, 2));
          NODE

      - name: Upload lockfile and audit evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m15-lockfile-and-audit
          path: |
            package-lock.json
            npm-audit-production.json
            npm-audit-full.json
            npm-audit-summary.json
          if-no-files-found: error
          retention-days: 14
