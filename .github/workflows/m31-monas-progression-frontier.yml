name: M31 MONAS progression frontier

on:
  pull_request:
    branches:
      - develop/sex-magick-2.0
    paths:
      - 'tools/monas-runtime.js'
      - 'tools/monas-reachability.js'
      - 'tools/monas-compositional-reachability.js'
      - 'tools/monas-progression-frontier.js'
      - 'tools/test-monas-progression-frontier.js'
      - 'tools/run-m31-monas-progression-frontier.js'
      - '.github/workflows/m31-monas-progression-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monas-progression-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Syntax-check frontier scanner
        run: |
          node --check tools/monas-progression-frontier.js
          node --check tools/test-monas-progression-frontier.js
          node --check tools/run-m31-monas-progression-frontier.js

      - name: Run frontier configuration contracts
        run: node tools/test-monas-progression-frontier.js

      - name: Scan targeted progression frontier
        run: node tools/run-m31-monas-progression-frontier.js

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m31-monas-progression-frontier-${{ github.run_attempt }}
          path: artifacts/m31-monas-progression-frontier.json
          if-no-files-found: warn
          retention-days: 14
