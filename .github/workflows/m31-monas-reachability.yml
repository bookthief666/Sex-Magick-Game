name: M31 MONAS reachability

on:
  pull_request:
    branches:
      - develop/sex-magick-2.0
    paths:
      - 'tools/monas-runtime.js'
      - 'tools/monas-reachability.js'
      - 'tools/monas-compositional-reachability.js'
      - 'tools/test-monas-reachability.js'
      - 'tools/test-monas-compositional-reachability.js'
      - 'tools/run-m31-monas-audit.js'
      - '.github/workflows/m31-monas-reachability.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full legal pattern-pair cross product'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  monas-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Syntax-check M31 solver surface
        run: |
          node --check tools/monas-reachability.js
          node --check tools/monas-compositional-reachability.js
          node --check tools/test-monas-reachability.js
          node --check tools/test-monas-compositional-reachability.js
          node --check tools/run-m31-monas-audit.js

      - name: Run hold/release reachability contracts
        run: |
          node tools/test-monas-reachability.js
          node tools/test-monas-compositional-reachability.js

      - name: Run bounded M31 evidence audit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.full != true }}
        run: node tools/run-m31-monas-audit.js

      - name: Run full M31 evidence audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        run: node tools/run-m31-monas-audit.js --full

      - name: Upload M31 reachability evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m31-monas-reachability-${{ github.run_attempt }}
          path: artifacts/m31-monas-reachability.json
          if-no-files-found: warn
          retention-days: 14
