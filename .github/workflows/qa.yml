name: QA checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - develop/sex-magick-2.0

permissions:
  contents: read

jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check runtime and tests
        run: |
          node --check tools/fixed-step-clock.js
          node --check tools/fixed-step-prototype.js
          node --check tools/collision-runtime.js
          node --check tools/run-telemetry.js
          node --check tools/test-fixed-step-clock.js
          node --check tools/test-collision-runtime.js
          node --check tools/test-run-telemetry.js
          node --check tools/browser-fixed-step-test.mjs
          node --check tools/browser-collision-test.mjs
          node --check tools/browser-telemetry-test.mjs
          node --check tools/run-browser-fixed-step-test.mjs
          node --check tools/run-browser-collision-test.mjs
          node --check tools/run-browser-telemetry-test.mjs

      - name: Run deterministic unit tests
        run: |
          node tools/test-fixed-step-clock.js
          node tools/test-collision-runtime.js
          node tools/test-run-telemetry.js

      - name: Run fixed-step Chrome integration
        run: node tools/run-browser-fixed-step-test.mjs

      - name: Run collision and touch Chrome integration
        run: node tools/run-browser-collision-test.mjs

      - name: Run telemetry and fast-retry Chrome integration
        run: node tools/run-browser-telemetry-test.mjs
