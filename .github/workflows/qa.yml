name: Fast gameplay QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - develop/sex-magick-2.0

permissions:
  contents: read

jobs:
  fast-gameplay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check runtime and tests
        run: |
          node --check tools/fixed-step-clock.js
          node --check tools/fixed-step-prototype.js
          node --check tools/collision-runtime.js
          node --check tools/input-feedback-policy.js
          node --check tools/run-telemetry.js
          node --check tools/obstacle-grammar.js
          node --check tools/player-reachability.js
          node --check tools/reachability-policy.js
          node --check tools/compositional-reachability.js
          node --check tools/compositional-robustness.js
          node --check tools/m7-review-diagnostics.js
          node --check tools/run-m7-review-audit.js
          node --check tools/test-fixed-step-clock.js
          node --check tools/test-collision-runtime.js
          node --check tools/test-input-feedback-policy.js
          node --check tools/test-r1-playtest-harness.js
          node --check tools/test-run-telemetry.js
          node --check tools/test-obstacle-grammar.js
          node --check tools/test-player-reachability.js
          node --check tools/test-compositional-reachability.js
          node --check tools/test-m7-review-diagnostics.js
          node --check tools/browser-fixed-step-test.mjs
          node --check tools/browser-collision-test.mjs
          node --check tools/browser-policy-fail-closed-test.mjs
          node --check tools/browser-telemetry-test.mjs
          node --check tools/run-browser-fixed-step-test.mjs
          node --check tools/run-browser-collision-test.mjs
          node --check tools/run-browser-telemetry-test.mjs
          node --check tools/run-browser-obstacle-grammar-test.mjs
          node --check tools/run-browser-reachability-test.mjs
          node --check tools/run-browser-compositional-test.mjs

      - name: Run fast deterministic contracts
        run: |
          node tools/test-fixed-step-clock.js
          node tools/test-collision-runtime.js
          node tools/test-input-feedback-policy.js
          node tools/test-r1-playtest-harness.js
          node tools/test-run-telemetry.js
          node tools/test-obstacle-grammar.js
          node tools/test-m7-review-diagnostics.js

      - name: Run fixed-step Chrome integration
        run: node tools/run-browser-fixed-step-test.mjs

      - name: Run collision, input, and touch Chrome integration
        run: node tools/run-browser-collision-test.mjs

      - name: Run fail-closed policy Chrome integration
        run: node tools/browser-policy-fail-closed-test.mjs

      - name: Run telemetry and fast-retry Chrome integration
        run: node tools/run-browser-telemetry-test.mjs

      - name: Run obstacle grammar Chrome integration
        run: node tools/run-browser-obstacle-grammar-test.mjs
